
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dog-racing-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: dog-racing-backend
    expose:
      - "3001"
    restart: unless-stopped
