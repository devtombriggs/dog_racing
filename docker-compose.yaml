
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dog-racing-frontend
    ports:
      # FRONTEND_PORT in .env: on the server 127.0.0.1:8088 (only nginx on the same machine can reach it)
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: dog-racing-backend
    expose:
      - "3001"
    environment:
      # the database (accounts, leaderboards) lives on the volume below, so it outlasts a rebuild
      DB_PATH: /data/zoomies.db
      # Google sign-in: set these in a .env file beside this one (see .env.example); left empty, it is off
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # the address players reach the game at, e.g. https://zoomies.example.com (left empty: worked out per request)
      PUBLIC_URL: ${PUBLIC_URL:-}
      # the people who run the game: accounts with these email addresses own everything in the Shop (commas between)
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    volumes:
      - zoomies-data:/data
    restart: unless-stopped
    # the connection log (players' addresses): kept small and overwritten, as the Privacy page says
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  zoomies-data:
