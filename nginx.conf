map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
map $http_x_forwarded_host $forwarded_host {
    default $http_x_forwarded_host;
    ""      $http_host;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    # (/privacy -> /privacy/ by a relative redirect, so a proxy in front ending HTTPS is not sent to http://...:80)
    absolute_redirect off;

    location /socket.io/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # (the player's address, for the connection log)

        proxy_read_timeout 86400;
    }

    # Signing in and the leaderboards (server/accounts.js).  When a proxy in front (Cloudflare, Caddy, another
    # nginx) ends HTTPS, what it says the address was is passed on, so cookies are Secure and Google's
    # callback is https.
    location ~ ^/(auth|api)/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}